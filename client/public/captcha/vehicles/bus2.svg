<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#fee2e2"/>
  <!-- Red Double Decker Bus -->
  <rect x="25" y="40" width="150" height="100" rx="10" fill="#dc2626"/>
  <!-- Top windows -->
  <rect x="35" y="50" width="25" height="20" fill="#38bdf8" rx="2"/>
  <rect x="70" y="50" width="25" height="20" fill="#38bdf8" rx="2"/>
  <rect x="105" y="50" width="25" height="20" fill="#38bdf8" rx="2"/>
  <rect x="140" y="50" width="25" height="20" fill="#38bdf8" rx="2"/>
  <!-- Bottom windows -->
  <rect x="35" y="90" width="25" height="20" fill="#38bdf8" rx="2"/>
  <rect x="70" y="90" width="25" height="20" fill="#38bdf8" rx="2"/>
  <rect x="105" y="90" width="25" height="20" fill="#38bdf8" rx="2"/>
  <!-- Wheels -->
  <circle cx="55" cy="140" r="14" fill="#0f172a"/>
  <circle cx="145" cy="140" r="14" fill="#0f172a"/>
</svg>
