<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#fff7ed"/>
  <!-- Cat Ears -->
  <polygon points="50,60 75,20 85,75" fill="#f97316"/>
  <polygon points="150,60 125,20 115,75" fill="#f97316"/>
  <!-- Head -->
  <circle cx="100" cy="90" r="45" fill="#fb923c"/>
  <!-- Eyes -->
  <circle cx="85" cy="85" r="7" fill="#15803d"/>
  <circle cx="115" cy="85" r="7" fill="#15803d"/>
  <!-- Nose/Mouth -->
  <polygon points="97,95 103,95 100,100" fill="#f43f5e"/>
  <!-- Whiskers -->
  <line x1="60" y1="95" x2="35" y2="90" stroke="#7c2d12" stroke-width="2"/>
  <line x1="60" y1="100" x2="35" y2="105" stroke="#7c2d12" stroke-width="2"/>
  <line x1="140" y1="95" x2="165" y2="90" stroke="#7c2d12" stroke-width="2"/>
  <line x1="140" y1="100" x2="165" y2="105" stroke="#7c2d12" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="100" cy="155" rx="40" ry="30" fill="#fb923c"/>
</svg>
