<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#fce7f3"/>
  <!-- Owl Body -->
  <ellipse cx="100" cy="115" rx="45" ry="55" fill="#854d0e"/>
  <!-- Eye Circles -->
  <circle cx="80" cy="90" r="22" fill="#ffffff" stroke="#713f12" stroke-width="4"/>
  <circle cx="120" cy="90" r="22" fill="#ffffff" stroke="#713f12" stroke-width="4"/>
  <!-- Glaring Pupils -->
  <circle cx="83" cy="92" r="8" fill="#000000"/>
  <circle cx="117" cy="92" r="8" fill="#000000"/>
  <!-- Angry eyebrows -->
  <line x1="60" y1="72" x2="95" y2="80" stroke="#451a03" stroke-width="5"/>
  <line x1="140" y1="72" x2="105" y2="80" stroke="#451a03" stroke-width="5"/>
  <!-- Beak -->
  <polygon points="95,98 105,98 100,112" fill="#eab308"/>
</svg>
